<!doctype html>
<html lang="zh"><meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 300px; padding: 16px; }
  button { width: 100%; }
  .eyebrow { margin-bottom: 12px; }
  .hint { margin-top: 6px; font-size: 12px; color: var(--placeholder); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hairline); font-size: 13px; }
  .foot button { width: auto; margin-top: 0; }
  label:first-of-type { margin-top: 16px; }
</style>
<body>
<div class="eyebrow">▲ DeepTranslate</div>
<button class="primary" id="toggle">翻译当前页 / 还原</button>
<p class="hint">选中文字后按快捷键，只翻译该段</p>

<label>目标语言</label>
<select id="targetLang"></select>
<label>我的语言 <small>该语言的文本不翻译</small></label>
<select id="userLang"></select>

<div class="foot">
  <span>快捷键 <kbd id="key">-</kbd> <a href="#" id="shortcut">修改</a></span>
  <button id="options">更多设置</button>
</div>
<script src="defaults.js"></script>
<script src="popup.js"></script>
</body></html>
